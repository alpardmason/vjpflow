[project]
name = "autograd"
version = "0.1.0"
description = "An educational, MLX-style lazy autograd engine with functional grad and numpy/Metal backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

# PyObjC's Metal bindings are only meaningful on macOS / Apple Silicon. We keep
# them as an optional extra so the core engine (numpy backend) installs and runs
# on any platform, and CI on Linux does not choke on a macOS-only wheel.
[project.optional-dependencies]
metal = [
    "pyobjc-framework-Metal>=10.0; sys_platform == 'darwin'",
]

[dependency-groups]
# Dev tooling lives in a uv dependency group (PEP 735), not in runtime deps.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autograd"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, didactic rule set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), bugbear (B), comprehensions (C4), naming (N).
select = ["F", "E", "W", "I", "UP", "B", "C4", "N"]
# Single-letter math names (X, W, Q, K, V, S) are *the* convention in the notes,
# so we do not fight ruff over them in the layer/model code. N812 allows the
# idiomatic `import functional as F` / `import primitives as P`.
ignore = ["E741", "N812"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# 'basic' keeps the signal useful without burying students in strict-mode noise.
typeCheckingMode = "basic"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path so tests can do `from tests.util import ...`.
pythonpath = ["."]
